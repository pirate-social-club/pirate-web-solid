name: Solid Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  solid-doctor:
    name: Solid Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Solid Doctor
        run: npx --yes solid-doctor@latest --diff "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" --target 2
