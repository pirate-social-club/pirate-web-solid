name: Solid Doctor

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  solid-doctor-pr:
    if: github.event_name == 'pull_request'
    name: Solid Doctor (PR)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Solid Doctor
        run: npx --yes solid-doctor@0.1.0 . --diff "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" --baseline .solid-doctor-baseline.json --target 2

  solid-doctor-main:
    if: github.event_name == 'push'
    name: Solid Doctor (main)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Solid Doctor
        run: npx --yes solid-doctor@0.1.0 . --baseline .solid-doctor-baseline.json --target 2
