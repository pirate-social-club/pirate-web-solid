name: Solid Doctor

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  solid-doctor-pr:
    if: github.event_name == 'pull_request'
    name: Solid Doctor (PR)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Start warn-only egress audit
        uses: ironsh/iron-proxy-action@fa1fd82ec32396d044deba7040a6db576bec927a # v0.1.4
        with:
          version: 0.41.0
          egress-rules: .github/egress/solid-doctor.yml
          warn: true
      - run: bun install --frozen-lockfile
      - name: Run Solid Doctor
        run: bun run check:solid-doctor -- --diff "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" --target 2
      - name: Show egress audit summary
        if: always()
        uses: ironsh/iron-proxy-action/summary@fa1fd82ec32396d044deba7040a6db576bec927a # v0.1.4

  solid-doctor-main:
    if: github.event_name == 'push'
    name: Solid Doctor (main)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Start warn-only egress audit
        uses: ironsh/iron-proxy-action@fa1fd82ec32396d044deba7040a6db576bec927a # v0.1.4
        with:
          version: 0.41.0
          egress-rules: .github/egress/solid-doctor.yml
          warn: true
      - run: bun install --frozen-lockfile
      - name: Run Solid Doctor
        run: bun run check:solid-doctor -- --target 2
      - name: Show egress audit summary
        if: always()
        uses: ironsh/iron-proxy-action/summary@fa1fd82ec32396d044deba7040a6db576bec927a # v0.1.4
