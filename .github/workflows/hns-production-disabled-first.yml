name: hns-production-disabled-first

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character Radicle and GitHub main commit to deploy
        required: true
        type: string
      confirmation:
        description: Type deploy-disabled-first
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hns-production-disabled-first-solid
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Verify exact disabled-first dispatch
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMATION" == "deploy-disabled-first" ]]
      - run: bun install --frozen-lockfile
      - name: Verify production switches remain disabled
        run: bun run test:production-config
      - name: Probe canonical Solid origin before mutation
        run: curl --fail --silent --show-error --max-time 10 https://pirate.sc/ > /dev/null
      - name: Record rollback version
        id: before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          before="$(bunx wrangler deployments list --env production --config wrangler.jsonc --json | jq -r '.[-1].versions[] | select(.percentage == 100) | .version_id' | tail -1)"
          [[ "$before" =~ ^[0-9a-f-]{36}$ ]]
          echo "version=$before" >> "$GITHUB_OUTPUT"
          echo "Rollback Worker version: \`$before\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Install production community secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HNS_FORWARDER_V3_HMAC_KEY_REGISTRY: ${{ secrets.HNS_FORWARDER_V3_HMAC_KEY_REGISTRY }}
          HNS_COMMUNITY_APP_API_ACCESS_CLIENT_ID: ${{ secrets.HNS_COMMUNITY_APP_API_ACCESS_CLIENT_ID }}
          HNS_COMMUNITY_APP_API_ACCESS_CLIENT_SECRET: ${{ secrets.HNS_COMMUNITY_APP_API_ACCESS_CLIENT_SECRET }}
          HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_ID: ${{ secrets.HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_ID }}
          HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_SECRET: ${{ secrets.HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "${HNS_FORWARDER_V3_HMAC_KEY_REGISTRY:-}"
          test -n "${HNS_COMMUNITY_APP_API_ACCESS_CLIENT_ID:-}"
          test -n "${HNS_COMMUNITY_APP_API_ACCESS_CLIENT_SECRET:-}"
          test -n "${HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_ID:-}"
          test -n "${HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_SECRET:-}"
          node -e 'process.stdout.write(JSON.stringify({HNS_FORWARDER_V3_HMAC_KEY_REGISTRY: process.env.HNS_FORWARDER_V3_HMAC_KEY_REGISTRY,HNS_COMMUNITY_APP_API_ACCESS_CLIENT_ID: process.env.HNS_COMMUNITY_APP_API_ACCESS_CLIENT_ID,HNS_COMMUNITY_APP_API_ACCESS_CLIENT_SECRET: process.env.HNS_COMMUNITY_APP_API_ACCESS_CLIENT_SECRET,HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_ID: process.env.HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_ID,HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_SECRET: process.env.HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_SECRET}))' |
            bunx wrangler secret bulk --env production --config wrangler.jsonc
      - name: Verify production secret names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          bunx wrangler secret list --env production --config wrangler.jsonc --format json > "$RUNNER_TEMP/solid-secret-names.json"
          node -e 'const rows=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); const names=new Set(rows.map(row=>row.name)); const expected=["HNS_FORWARDER_V3_HMAC_KEY_REGISTRY","HNS_COMMUNITY_APP_API_ACCESS_CLIENT_ID","HNS_COMMUNITY_APP_API_ACCESS_CLIENT_SECRET","HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_ID","HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_SECRET"]; for (const name of expected) if (!names.has(name)) throw new Error(`required secret is absent: ${name}`);' "$RUNNER_TEMP/solid-secret-names.json"
      - name: Build exact production Worker
        env:
          CLOUDFLARE_ENV: production
          NODE_OPTIONS: --max-old-space-size=3072
        run: bun run build
      - name: Credential-safe production dry run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=3072
        run: bunx wrangler deploy --dry-run --config dist/ssr/wrangler.json
      - name: Deploy production Solid with HNS disabled
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=3072
        run: >-
          bunx wrangler deploy --config dist/ssr/wrangler.json
          --message "HNS disabled-first $GITHUB_SHA"
      - name: Probe canonical Solid origin after deployment
        run: curl --fail --silent --show-error --max-time 10 https://pirate.sc/ > /dev/null
      - name: Record deployed version and protected domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          after="$(bunx wrangler deployments list --env production --config wrangler.jsonc --json | jq -r '.[-1].versions[] | select(.percentage == 100) | .version_id' | tail -1)"
          [[ "$after" =~ ^[0-9a-f-]{36}$ ]]
          test "$after" != "${{ steps.before.outputs.version }}"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/08a4c22cf52e2ecae883e36f80a33f4a/workers/domains?hostname=hns-community-ingress.pirate.sc" \
            --output "$RUNNER_TEMP/solid-domain.json"
          domain="$(jq -r '.result[] | select(.hostname == "hns-community-ingress.pirate.sc" and .service == "pirate-web-solid-production") | [.id, .hostname, .service, .cert_id] | @tsv' "$RUNNER_TEMP/solid-domain.json")"
          test -n "$domain"
          echo "Deployed Worker version: \`$after\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Protected Custom Domain: \`$domain\`" >> "$GITHUB_STEP_SUMMARY"
