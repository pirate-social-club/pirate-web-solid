name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Build staging Worker artifact
        run: bun run build
        env:
          CLOUDFLARE_ENV: staging
          NODE_OPTIONS: --max-old-space-size=3072
      - name: Wrangler dry run
        run: bunx wrangler deploy --dry-run --config dist/ssr/wrangler.json
        env:
          NODE_OPTIONS: --max-old-space-size=3072
      - name: Check post-engagement Worker proxy transport
        run: bun run post-engagement-check
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ steps.playwright.outputs.version }}
      # The cache stores browsers, not Linux system dependencies.
      - name: Install Chromium for browser probes
        run: bunx playwright install --with-deps chromium
      - name: Check text-post browser flow through Worker proxy
        run: bun run text-post-check

  storybook-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ steps.playwright.outputs.version }}
      # The cache stores browsers, not Linux system dependencies.
      - name: Install Chromium for Storybook audit
        run: bunx playwright install --with-deps chromium
      - name: Build Storybook
        run: bun run build-storybook
      - name: Audit Storybook accessibility and interactions
        run: |
          python3 -m http.server 6006 --directory storybook-static > "$RUNNER_TEMP/storybook-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:6006/index.json > /dev/null
          bun run storybook:a11y
      - name: Upload Storybook audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-a11y-${{ github.run_id }}
          path: .tmp/storybook-a11y/
          if-no-files-found: ignore
          retention-days: 7
