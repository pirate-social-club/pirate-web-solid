name: hns-production-enable

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit to deploy
        required: true
        type: string
      confirmation:
        description: Type enable-production-community
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hns-production-enable-solid
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Verify exact enabled dispatch
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$CONFIRMATION" == "enable-production-community" ]]
      - run: bun install --frozen-lockfile
      - name: Verify production community graph
        run: bun run test:production-config
      - name: Verify secrets and canonical Solid before mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 https://pirate.sc/ > /dev/null
          bun run wrangler secret list --env production --config wrangler.jsonc --format json > "$RUNNER_TEMP/secrets.json"
          node -e 'const rows=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));const names=new Set(rows.map(row=>row.name));for(const name of ["HNS_FORWARDER_V3_HMAC_KEY_REGISTRY","HNS_COMMUNITY_APP_API_ACCESS_CLIENT_ID","HNS_COMMUNITY_APP_API_ACCESS_CLIENT_SECRET","HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_ID","HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_SECRET"])if(!names.has(name))throw new Error(`missing secret: ${name}`)' "$RUNNER_TEMP/secrets.json"
      - name: Validate and reinstall production community secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HNS_FORWARDER_V3_HMAC_KEY_REGISTRY: ${{ secrets.HNS_FORWARDER_V3_HMAC_KEY_REGISTRY }}
          HNS_COMMUNITY_APP_API_ACCESS_CLIENT_ID: ${{ secrets.HNS_COMMUNITY_APP_API_ACCESS_CLIENT_ID }}
          HNS_COMMUNITY_APP_API_ACCESS_CLIENT_SECRET: ${{ secrets.HNS_COMMUNITY_APP_API_ACCESS_CLIENT_SECRET }}
          HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_ID: ${{ secrets.HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_ID }}
          HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_SECRET: ${{ secrets.HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const registry = process.env.HNS_FORWARDER_V3_HMAC_KEY_REGISTRY ?? "";
          const expectedDigest = "6fa7dcad7c6a989998a10ec8cf228434d00387343d9008da11c7dfeabed95f33";
          const digest = createHash("sha256").update(registry).digest("hex");
          if (digest !== expectedDigest) throw new Error("forwarder registry digest mismatch");
          const document = JSON.parse(registry);
          if (
            document.schema !== "pirate-hns-forwarder-v3-key-registry-v1" ||
            document.registry_reference !== "pirate:hns-forwarder-v3:production-community-app:v1" ||
            document.registry_version !== "2026-08-28-02" ||
            !Array.isArray(document.keys) ||
            document.keys.filter((key) => key?.signing_enabled === true).length !== 1
          ) throw new Error("forwarder registry shape mismatch");
          const names = ["API", "AUTHORITY"];
          const values = names.map((name) => ({
            id: process.env[`HNS_COMMUNITY_APP_${name}_ACCESS_CLIENT_ID`] ?? "",
            secret: process.env[`HNS_COMMUNITY_APP_${name}_ACCESS_CLIENT_SECRET`] ?? "",
          }));
          for (const value of values) {
            if (!/^[0-9a-f]{32}\.access$/u.test(value.id)) throw new Error("Access client id is not a bare value");
            if (!/^[A-Za-z0-9_-]{32,256}$/u.test(value.secret)) throw new Error("Access client secret is not a bare value");
          }
          if (values[0].id === values[1].id || values[0].secret === values[1].secret) {
            throw new Error("API and authority Access credentials must be distinct");
          }
          console.log("production community secret shapes verified");
          NODE
          node -e 'process.stdout.write(JSON.stringify({HNS_FORWARDER_V3_HMAC_KEY_REGISTRY:process.env.HNS_FORWARDER_V3_HMAC_KEY_REGISTRY,HNS_COMMUNITY_APP_API_ACCESS_CLIENT_ID:process.env.HNS_COMMUNITY_APP_API_ACCESS_CLIENT_ID,HNS_COMMUNITY_APP_API_ACCESS_CLIENT_SECRET:process.env.HNS_COMMUNITY_APP_API_ACCESS_CLIENT_SECRET,HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_ID:process.env.HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_ID,HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_SECRET:process.env.HNS_COMMUNITY_APP_AUTHORITY_ACCESS_CLIENT_SECRET}))' |
            bun run wrangler secret bulk --env production --config wrangler.jsonc
      - name: Record rollback version
        id: before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          before="$(bun run wrangler deployments list --env production --config wrangler.jsonc --json | jq -r '.[-1].versions[] | select(.percentage == 100) | .version_id' | tail -1)"
          [[ "$before" =~ ^[0-9a-f-]{36}$ ]]
          echo "version=$before" >> "$GITHUB_OUTPUT"
          echo "Rollback Worker version: \`$before\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Build and deploy enabled production Solid
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          set -euo pipefail
          CLOUDFLARE_ENV=production bun run build
          jq -e '.name == "pirate-web-solid-production" and (.env == null)' dist/ssr/wrangler.json > /dev/null
          env -u CLOUDFLARE_ENV bun run wrangler deploy --dry-run --config dist/ssr/wrangler.json --outdir "$RUNNER_TEMP/bundle"
          env -u CLOUDFLARE_ENV bun run wrangler deploy --config dist/ssr/wrangler.json --message "HNS community enabled $GITHUB_SHA"
      - name: Verify enabled production Solid
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 https://pirate.sc/ > /dev/null
          after="$(bun run wrangler deployments list --env production --config wrangler.jsonc --json | jq -r '.[-1].versions[] | select(.percentage == 100) | .version_id' | tail -1)"
          [[ "$after" =~ ^[0-9a-f-]{36}$ ]]
          test "$after" != "${{ steps.before.outputs.version }}"
          echo "Enabled Worker version: \`$after\`" >> "$GITHUB_STEP_SUMMARY"
