# pirate-web-solid Radicle CI plan — v2 dependency-acquiring gate.
#
# Runs the real install + verify surface in an isolated Ambient guest. The
# pre_plan downloads a checksum-pinned Bun and populates a Bun install cache
# via bun_get; the plan phase installs offline and runs `verify`.
#
# Scope is deliberately narrower than the GitHub workflow. A green Radicle
# run is not equivalent to a green GitHub run until these are closed:
# - Storybook/Playwright: GitHub runs `bunx playwright install --with-deps
#   chromium` (a browser download plus apt system packages) and then the
#   Storybook a11y audit. The plan VM is network-isolated, so neither runs
#   until Chromium is delivered through a pre_plan action.
# - build + wrangler: `bun run build` is self-contained and can be added next;
#   `bunx wrangler deploy --dry-run` is untested here and may reach out for
#   compatibility data, so it stays out until verified.

pre_plan:
  - action: http_get
    items:
      - url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
        filename: bun-linux-x64.zip
        checksum: sha256:2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452
  - action: bun_get
    bun_zip: bun-linux-x64.zip

plan:
  - action: shell
    shell: |
      set -euo pipefail
      export PATH=/ci/deps/bun-linux-x64:$PATH
      export BUN_INSTALL_CACHE_DIR=/ci/deps/bun/default
      cd /ci/src
      bun install --frozen-lockfile --offline
      bun run verify

post_plan: []
