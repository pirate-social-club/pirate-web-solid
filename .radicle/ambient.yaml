# pirate-web-solid Radicle CI plan — v4 pinned-runtime verification gates.
#
# Runs the real install + verification surface in an isolated Ambient guest.
# The pre_plan downloads checksum-pinned Bun and Node distributions and
# populates a Bun install cache via bun_get. The plan installs offline and
# exposes every verification gate as a separate action. Ambient 0.16 stops a
# plan at the first failed action, so each gate records its command status and
# a final summary action fails the job after every gate has had a chance to run.
#
# Scope is deliberately narrower than the GitHub workflow. A green Radicle
# run is not equivalent to a green GitHub run until this is closed:
# - Browser execution and Storybook: GitHub installs Chromium plus apt system
#   packages, runs the text-post browser flow, and audits the built Storybook.
#   The plan VM is network-isolated, so those checks wait until Chromium is
#   delivered through a pre_plan action. Gate 13 does cover the repository's
#   browser-free E2E typecheck and Playwright test discovery.
# Build and the repository-pinned Wrangler dry-run were both rehearsed with
# Node 24.14.0 and Bun 1.4.0 in a network namespace with no route. Wrangler's
# default banner and telemetry paths attempted DNS even though the dry-run did
# not require their result. The pinned controls on gate 12 suppressed those
# paths; a syscall trace then contained no Internet socket or DNS attempt. The
# plan invokes Wrangler through `bun run`, never `bunx`, so it cannot fetch a
# replacement package.

pre_plan:
  - action: http_get
    items:
      - url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
        filename: bun-linux-x64.zip
        checksum: sha256:2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452
      - url: https://nodejs.org/dist/v24.14.0/node-v24.14.0-linux-x64.tar.gz
        filename: node-v24.14.0-linux-x64.tar.gz
        checksum: sha256:dbf5b8665dec15e59e6359a517fefb47b23fdb9152d8def975b9bca3dfc6d355
  - action: bun_get
    bun_zip: bun-linux-x64.zip

plan:
  - action: shell
    shell: |
      set -euo pipefail
      tar -xzf /ci/deps/node-v24.14.0-linux-x64.tar.gz -C /tmp
      export PATH=/tmp/node-v24.14.0-linux-x64/bin:/ci/deps/bun-linux-x64:$PATH
      export BUN_INSTALL_CACHE_DIR=/ci/deps/bun/default
      cd /ci/src
      test "$(node --version)" = v24.14.0
      test "$(bun --version)" = 1.4.0
      bun install --frozen-lockfile --offline
      cat > /tmp/run-verification-gate <<'EOF'
      #!/bin/bash
      set -uo pipefail
      gate="$1"
      shift
      printf '\n=== verification gate: %s ===\n' "$gate"
      set +e
      "$@"
      status="$?"
      set -e
      printf '%s\n' "$status" > "/tmp/ambient-verification-$gate.status"
      if [ "$status" -eq 0 ]; then
        printf 'PASS: %s\n' "$gate"
      else
        printf 'FAIL: %s (exit %s)\n' "$gate" "$status"
      fi
      exit 0
      EOF
      chmod 0755 /tmp/run-verification-gate
  - action: shell
    shell: |
      set -euo pipefail
      export PATH=/tmp/node-v24.14.0-linux-x64/bin:/ci/deps/bun-linux-x64:$PATH
      cd /ci/src
      /tmp/run-verification-gate 01-generate-worker-types bun run generate-worker-types
  - action: shell
    shell: |
      set -euo pipefail
      export PATH=/tmp/node-v24.14.0-linux-x64/bin:/ci/deps/bun-linux-x64:$PATH
      cd /ci/src
      /tmp/run-verification-gate 02-tsc bun run tsc --noEmit -p tsconfig.json
  - action: shell
    shell: |
      set -euo pipefail
      export PATH=/tmp/node-v24.14.0-linux-x64/bin:/ci/deps/bun-linux-x64:$PATH
      cd /ci/src
      /tmp/run-verification-gate 03-test-api bun run test:api
  - action: shell
    shell: |
      set -euo pipefail
      export PATH=/tmp/node-v24.14.0-linux-x64/bin:/ci/deps/bun-linux-x64:$PATH
      cd /ci/src
      /tmp/run-verification-gate 04-test-app bun run test:app
  - action: shell
    shell: |
      set -euo pipefail
      export PATH=/tmp/node-v24.14.0-linux-x64/bin:/ci/deps/bun-linux-x64:$PATH
      cd /ci/src
      # Oxlint's JavaScript-plugin transfer reserves a 4-GiB virtual arena.
      # The image disables memory overcommit, so reserve it only for this gate
      # and restore the image policy before continuing.
      # Temporary workaround: remove when oxc#20331/oxc#20513 no longer require
      # relaxing overcommit for JavaScript plugins on constrained Linux guests.
      original_overcommit="$(sysctl -n vm.overcommit_memory)"
      sysctl -w vm.overcommit_memory=1
      /tmp/run-verification-gate 05-lint bun run lint
      sysctl -w "vm.overcommit_memory=$original_overcommit"
  - action: shell
    shell: |
      set -euo pipefail
      export PATH=/tmp/node-v24.14.0-linux-x64/bin:/ci/deps/bun-linux-x64:$PATH
      cd /ci/src
      /tmp/run-verification-gate 06-solid-runtime node scripts/check-solid-runtime.mjs
  - action: shell
    shell: |
      set -euo pipefail
      export PATH=/tmp/node-v24.14.0-linux-x64/bin:/ci/deps/bun-linux-x64:$PATH
      cd /ci/src
      /tmp/run-verification-gate 07-web3-icons bun run check:web3-icons
  - action: shell
    shell: |
      set -euo pipefail
      export PATH=/tmp/node-v24.14.0-linux-x64/bin:/ci/deps/bun-linux-x64:$PATH
      cd /ci/src
      /tmp/run-verification-gate 08-solid-ui-typecheck bun run --cwd packages/solid-ui typecheck
  - action: shell
    shell: |
      set -euo pipefail
      export PATH=/tmp/node-v24.14.0-linux-x64/bin:/ci/deps/bun-linux-x64:$PATH
      cd /ci/src
      # Keep Vitest's assertion set intact while allowing for the constrained
      # guest: one interaction test crossed the 5s default at 5.2s.
      # GitHub retains Vitest's 5s default, so a Radicle-green test taking
      # between 5s and 10s can still fail there.
      /tmp/run-verification-gate 09-solid-ui-test bun run --cwd packages/solid-ui test -- --testTimeout=10000
  - action: shell
    shell: |
      set -euo pipefail
      export PATH=/tmp/node-v24.14.0-linux-x64/bin:/ci/deps/bun-linux-x64:$PATH
      cd /ci/src
      /tmp/run-verification-gate 10-solid-doctor bun run check:solid-doctor
  - action: shell
    shell: |
      set -euo pipefail
      export PATH=/tmp/node-v24.14.0-linux-x64/bin:/ci/deps/bun-linux-x64:$PATH
      export CLOUDFLARE_ENV=staging
      export NODE_OPTIONS=--max-old-space-size=3072
      cd /ci/src
      /tmp/run-verification-gate 11-build bun run build
  - action: shell
    shell: |
      set -euo pipefail
      export PATH=/tmp/node-v24.14.0-linux-x64/bin:/ci/deps/bun-linux-x64:$PATH
      export CI=1
      export NODE_OPTIONS=--max-old-space-size=3072
      export WRANGLER_HIDE_BANNER=true
      export WRANGLER_SEND_ERROR_REPORTS=false
      export WRANGLER_SEND_METRICS=false
      cd /ci/src
      /tmp/run-verification-gate 12-wrangler-dry-run \
        bun run wrangler deploy --dry-run --config dist/ssr/wrangler.json
  - action: shell
    shell: |
      set -euo pipefail
      export PATH=/tmp/node-v24.14.0-linux-x64/bin:/ci/deps/bun-linux-x64:$PATH
      cd /ci/src
      /tmp/run-verification-gate 13-e2e-list bun run check:e2e
  - action: shell
    shell: |
      set -euo pipefail
      failed=0
      for gate in \
        01-generate-worker-types \
        02-tsc \
        03-test-api \
        04-test-app \
        05-lint \
        06-solid-runtime \
        07-web3-icons \
        08-solid-ui-typecheck \
        09-solid-ui-test \
        10-solid-doctor \
        11-build \
        12-wrangler-dry-run \
        13-e2e-list
      do
        status="$(cat "/tmp/ambient-verification-$gate.status")"
        if [ "$status" -eq 0 ]; then
          printf 'PASS: %s\n' "$gate"
        else
          printf 'FAIL: %s (exit %s)\n' "$gate" "$status"
          failed=1
        fi
      done
      if [ "$failed" -ne 0 ]; then
        echo 'one or more verification gates failed'
        exit 1
      fi
      echo 'all verification gates passed'

post_plan: []
