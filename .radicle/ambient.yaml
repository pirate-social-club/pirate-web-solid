# pirate-web-solid Radicle CI plan — v1 dependency-free smoke gate.
#
# Intentionally minimal: it proves the new-RID path end-to-end (broker filter
# -> Ambient guest -> Run/Finished COB) without waiting on the signed
# dependency artifact lane. Real checks land as a later commit to this file.
#
# Deliberately absent from v1:
# - pre_plan / bun_get: the deployed bun_get output shape (registry tarballs
#   plus a manifest.tsv) was rejected by the project's own probe — Bun 1.4.0
#   cannot consume it as an install cache (docs/ci/ambient-bun-dependency-
#   artifact.md). Dependency acquisition waits on the signed artifact lane.
# - the real `verify` script and its typecheck/test/lint surface all need
#   node_modules, so every real check is blocked on the same dependency lane.

pre_plan: []

plan:
  - action: shell
    shell: |
      set -euo pipefail
      test -d /ci/src
      test -f /ci/src/package.json
      test -f /ci/src/bun.lock
      grep -Fq '"name": "pirate-web-solid"' /ci/src/package.json
      echo 'pirate-web-solid source snapshot verified at /ci/src'

post_plan: []
